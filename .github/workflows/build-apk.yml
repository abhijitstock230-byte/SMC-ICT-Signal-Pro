name: Build SMC ICT Signal Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and unzip Android project
        run: |
          set -e

          ZIP_FILE="./SMC_ICT_Signal_Pro_Updated_Project_JVM17.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Updated project ZIP not found!"
            echo "Files in repository:"
            find . -maxdepth 2 -type f
            exit 1
          fi

          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

          SETTINGS_FILE=$(find source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found!"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle assembleDebug

          APK_FILE=$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          cp "$APK_FILE" "$GITHUB_WORKSPACE/SMC-ICT-Signal-Pro.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMC-ICT-Signal-Pro-APK
          path: SMC-ICT-Signal-Pro.apk
          if-no-files-found: error
          retention-days: 7
