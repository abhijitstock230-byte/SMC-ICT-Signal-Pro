name: Build SMC ICT Signal Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip Android project
        run: |
          set -e
          mkdir -p source
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found in repository root"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d source
          SETTINGS_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No Gradle settings file found inside ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleDebug
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/SMC-ICT-Signal-Pro.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMC-ICT-Signal-Pro-APK
          path: SMC-ICT-Signal-Pro.apk
