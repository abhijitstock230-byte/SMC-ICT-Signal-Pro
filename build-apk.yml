name: Build SMC ICT Signal Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip Android project
        run: |
          unzip -o SMC_ICT_Signal_Pro.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/SMC-ICT-Signal-Pro.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMC-ICT-Signal-Pro-APK
          path: SMC-ICT-Signal-Pro.apk
